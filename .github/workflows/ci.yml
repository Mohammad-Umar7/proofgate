name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "./engine[dev]"
      - name: Cache curl history
        uses: actions/cache@v4
        with:
          path: ~/.cache/proofgate/repos
          key: curl-history-${{ github.run_id }}
          restore-keys: curl-history-
      - name: Test (deterministic stages against real curl history)
        working-directory: engine
        env:
          PG_SANDBOX: "off"
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
