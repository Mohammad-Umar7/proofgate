[project]
name = "proofgate"
version = "0.1.0"
description = "Evidence-first triage for vulnerability reports, on NVIDIA Nemotron via Nebius Token Factory."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=1.50",
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "tree-sitter>=0.23",
  "tree-sitter-c>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
proofgate = "proofgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proofgate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
